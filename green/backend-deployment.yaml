apiVersion: apps/v1
kind: Deployment

metadata:
  name: food-backend
  namespace: green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: food-backend

  template:
    metadata:
      labels:
        app: food-backend

    spec:
      containers:

      - name: backend

        image: thabith12/food-backend:v5

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 4000


        env:

        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: food-config
              key: PORT


        - name: MONGO_URL
          valueFrom:
            configMapKeyRef:
              name: food-config
              key: MONGO_URL


        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: food-config
              key: FRONTEND_URL


        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: food-secret
              key: JWT_SECRET


        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: food-secret
              key: MONGO_USERNAME


        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: food-secret
              key: MONGO_PASSWORD


        resources:

          requests:
            memory: "256Mi"
            cpu: "250m"

          limits:
            memory: "512Mi"
            cpu: "500m"
