apiVersion: apps/v1
kind: Deployment

metadata:
  name: food-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: food-frontend

  template:
    metadata:
      labels:
        app: food-frontend

    spec:
      containers:
        - name: frontend

          image: thabith12/food-frontend:v3

          imagePullPolicy: Always

          ports:
            - containerPort: 5173

          env:
            - name: VITE_BACKEND_URL
              value: "http://food-backend-service:4000"
