apiVersion: apps/v1
kind: StatefulSet

metadata:

  name: mongodb

  namespace: food-app


spec:

  serviceName: mongodb-service

  replicas: 1


  selector:

    matchLabels:

      app: mongodb


  template:

    metadata:

      labels:

        app: mongodb


    spec:

      containers:

      - name: mongodb

        image: mongo:7


        ports:

        - containerPort: 27017


        env:

        - name: MONGO_INITDB_ROOT_USERNAME

          valueFrom:

            secretKeyRef:

              name: food-secret

              key: MONGO_USERNAME



        - name: MONGO_INITDB_ROOT_PASSWORD

          valueFrom:

            secretKeyRef:

              name: food-secret

              key: MONGO_PASSWORD



        volumeMounts:

        - name: mongodb-data

          mountPath: /data/db



      volumes:

      - name: mongodb-data

        persistentVolumeClaim:

          claimName: mongodb-storage
