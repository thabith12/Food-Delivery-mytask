apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-backend
  namespace: food-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-backend
  template:
    metadata:
      labels:
        app: food-backend
    spec:
      containers:
        - name: backend
          image: 643603452212.dkr.ecr.eu-north-1.amazonaws.com/food-backend:v2
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGO_URL
              value: "mongodb://mongodb:27017/fooddelivery"
