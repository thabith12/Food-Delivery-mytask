apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-frontend
  namespace: food-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-frontend
  template:
    metadata:
      labels:
        app: food-frontend
    spec:
      containers:
        - name: frontend
          image: 643603452212.dkr.ecr.eu-north-1.amazonaws.com/food-frontend:v2
          ports:
            - containerPort: 80
